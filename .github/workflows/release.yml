name: Release

# Push a tag like v1.0.0 → build, test, sign and publish the APK as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is missing"; exit 1; fi
          done

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build release APK
        env:
          TEDDYPLAYER_KEYSTORE: ${{ runner.temp }}/release.jks
          TEDDYPLAYER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TEDDYPLAYER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TEDDYPLAYER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease -PversionName="$VERSION"
          mv app/build/outputs/apk/release/app-release.apk "TeddyPlayer-$VERSION.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: TeddyPlayer-*.apk
          generate_release_notes: true
